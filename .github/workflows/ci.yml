name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e --workers=2

      - name: Retain failed browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  rust:
    name: Rust checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Format check
        working-directory: apps/pos/src-tauri
        run: cargo fmt --check

      - name: Compile check
        working-directory: apps/pos/src-tauri
        run: cargo check --locked

      - name: Rust tests (Linux)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: apps/pos/src-tauri
        run: cargo test --locked -- --test-threads=1

      - name: Rust tests (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: apps/pos/src-tauri
        shell: pwsh
        run: |
          cargo test --locked -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'The Windows Rust test suite failed.' }

      - name: Small-stack SHA-256 regression (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: apps/pos/src-tauri
        shell: pwsh
        run: |
          $result = @(cargo test --locked backup::tests::file_hashing_fits_a_small_windows_stack_and_handles_chunk_boundaries -- --exact --nocapture)
          $testExitCode = $LASTEXITCODE
          $result | Write-Output
          if ($testExitCode -ne 0) { throw 'The Windows small-stack SHA-256 regression test failed.' }
          if (($result -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') {
            throw 'The Windows small-stack SHA-256 regression test did not execute successfully.'
          }
          Write-Output 'Windows small-stack SHA-256 regression test passed.'

      - name: Set up pnpm for the Windows bundle
        if: matrix.os == 'windows-latest'
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node for the Windows bundle
        if: matrix.os == 'windows-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies for the Windows bundle
        if: matrix.os == 'windows-latest'
        run: pnpm install --frozen-lockfile

      - name: Build Windows NSIS and MSI installers
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_DEBUG: limited
          CARGO_PROFILE_RELEASE_STRIP: none
        run: pnpm --filter @ate05/pos exec tauri build --bundles nsis,msi

      - name: Verify installers exclude debug files and record executable identity
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/verify-windows-build.ps1

      - name: Retain Windows installers
        if: matrix.os == 'windows-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ate05-windows-x64-installers-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            apps/pos/src-tauri/target/release/bundle/nsis/*setup.exe
            apps/pos/src-tauri/target/release/bundle/msi/*.msi

      - name: Retain Windows crash-analysis symbols
        if: matrix.os == 'windows-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ate05-windows-x64-crash-symbols-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: apps/pos/src-tauri/target/release/crash-analysis/
