name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS Intel
            # macos-13 was retired; this label is the supported Intel runner.
            os: macos-15-intel
            args: "--target x86_64-apple-darwin"
          - name: macOS Apple Silicon
            os: macos-14
            args: "--target aarch64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.os == 'macos-15-intel' && 'x86_64-apple-darwin' || matrix.os == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows native startup regression
        if: matrix.os == 'windows-latest'
        working-directory: apps/pos/src-tauri
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked -- --test-threads=1

      - name: Import Windows signing certificate
        if: matrix.os == 'windows-latest' && vars.WINDOWS_CODE_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Windows signing is enabled but required repository secrets are missing.'
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'ritech-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          try {
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert -or $cert.Subject -ne 'CN=RiTech' -or -not $cert.HasPrivateKey) {
              throw 'Imported signing certificate is missing, lacks its private key, or has an unexpected subject.'
            }
            $thumbprint = $cert.Thumbprint
            $config = @{ bundle = @{ windows = @{ certificateThumbprint = $thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5
            Set-Content -Path 'apps/pos/src-tauri/windows-signing.json' -Value $config -Encoding utf8
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Preserve Windows crash symbols
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          "CARGO_PROFILE_RELEASE_DEBUG=limited" | Add-Content -LiteralPath $env:GITHUB_ENV
          "CARGO_PROFILE_RELEASE_STRIP=none" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/pos
          args: ${{ matrix.os == 'windows-latest' && vars.WINDOWS_CODE_SIGNING_ENABLED == 'true' && '--config src-tauri/windows-signing.json' || matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('ATE05 POS {0}', github.ref_name) || '' }}
          releaseBody: |
            ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-rc.') && '**TEST RELEASE — Windows printer support:** Windows printer queue discovery and physical USB/Bluetooth printing still need verification on Windows. Install or pair the printer in Windows, add it under Printers & scanners, then select its installed queue in ATE05 Settings → Printers and print a test slip before using it for live orders.' || '' }}

            ## Install ATE05 POS

            Download the file for your operating system and CPU, install it normally, and launch ATE05 POS. A fresh installation opens the restaurant setup wizard; it does not ask configuration questions in the OS installer.

            Start by setting the owner PIN, choose an editable starter menu if useful, add initial tables, and configure printers later in Settings. Keep an exported backup on separate storage.

            Cloud backups created by this release are not encrypted by ATE05. Anyone with access to the Google account or a downloaded backup file may be able to read its restaurant data. Keep the Google account secure and protect exported backup files.

            macOS and Windows artifacts require platform security approval until production signing credentials are configured.
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-rc.') }}
          generateReleaseNotes: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "ate05-[platform]-[arch]-[bundle]"

      - name: Record Windows executable identity
        if: matrix.os == 'windows-latest' && !cancelled()
        shell: pwsh
        run: |
          $exe = 'apps/pos/src-tauri/target/release/ate05-pos.exe'
          $pdb = @(Get-ChildItem -LiteralPath 'apps/pos/src-tauri/target/release' -Filter '*.pdb' |
            Where-Object { $_.BaseName -in @('ate05-pos', 'ate05_pos') })
          if (-not (Test-Path -LiteralPath $exe) -or $pdb.Count -ne 1) {
            throw 'The Windows executable or PDB was not produced.'
          }
          @(
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF_NAME"
            "exe_sha256=$((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant())"
            "pdb_file=$($pdb[0].Name)"
            "pdb_sha256=$((Get-FileHash -LiteralPath $pdb[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            "rustc=$(& rustc --version)"
          ) | Set-Content -LiteralPath 'apps/pos/src-tauri/target/release/windows-symbols.txt' -Encoding utf8

      - name: Retain Windows crash-analysis symbols
        if: matrix.os == 'windows-latest' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ate05-windows-x64-crash-symbols-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            apps/pos/src-tauri/target/release/ate05-pos.exe
            apps/pos/src-tauri/target/release/ate05*.pdb
            apps/pos/src-tauri/target/release/windows-symbols.txt
