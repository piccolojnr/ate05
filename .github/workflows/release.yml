name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild without moving the tag
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS Intel
            # macos-13 was retired; this label is the supported Intel runner.
            os: macos-15-intel
            args: "--target x86_64-apple-darwin"
          - name: macOS Apple Silicon
            os: macos-14
            args: "--target aarch64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage Windows verifier from workflow revision
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item -LiteralPath scripts/verify-windows-build.ps1 -Destination "$env:RUNNER_TEMP/verify-windows-build.ps1"

      - name: Checkout existing release tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Record exact application source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.os == 'macos-15-intel' && 'x86_64-apple-darwin' || matrix.os == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows native startup regression
        if: matrix.os == 'windows-latest'
        working-directory: apps/pos/src-tauri
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed.' }
          cargo check --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust compilation failed.' }
          cargo test --locked -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }

      - name: Import Windows signing certificate
        if: matrix.os == 'windows-latest' && vars.WINDOWS_CODE_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Windows signing is enabled but required repository secrets are missing.'
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'ritech-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          try {
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert -or $cert.Subject -ne 'CN=RiTech' -or -not $cert.HasPrivateKey) {
              throw 'Imported signing certificate is missing, lacks its private key, or has an unexpected subject.'
            }
            $thumbprint = $cert.Thumbprint
            $config = @{ bundle = @{ windows = @{ certificateThumbprint = $thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5
            Set-Content -Path 'apps/pos/src-tauri/windows-signing.json' -Value $config -Encoding utf8
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Preserve Windows crash symbols
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          "CARGO_PROFILE_RELEASE_DEBUG=limited" | Add-Content -LiteralPath $env:GITHUB_ENV
          "CARGO_PROFILE_RELEASE_STRIP=none" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/pos
          args: ${{ matrix.os == 'windows-latest' && vars.WINDOWS_CODE_SIGNING_ENABLED == 'true' && '--config src-tauri/windows-signing.json' || matrix.args }}
          tagName: ${{ steps.source.outputs.tag }}
          releaseName: ${{ steps.source.outputs.tag != '' && format('ATE05 POS {0}', steps.source.outputs.tag) || '' }}
          releaseBody: |
            ## ATE05 POS 0.2.1 RC.4

            This release candidate includes a Windows startup reliability fix, improved backup reliability, better Windows crash diagnostics and symbol support, and the previous 0.2.1 printer and setup improvements. Kitchen tickets and customer receipts have been tested successfully on physical printers.

            On Windows, download the x64 setup EXE below, run the installer, and launch ATE05 POS. Existing POS data should open normally; a fresh installation opens the setup wizard. Keep a separate backup of your data.

            Windows builds are signed by RiTech. SmartScreen may still show an unrecognized-app warning because application reputation is separate from signing. Check the publisher and download source before proceeding; do not disable Windows security protections globally.

            Cloud backups are not encrypted by ATE05. Protect the Google account and exported backup files.

            Final Windows regression testing is required before stable 0.2.1 approval.
          releaseDraft: false
          prerelease: ${{ contains(steps.source.outputs.tag, '-rc.') }}
          generateReleaseNotes: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "ate05-[platform]-[arch]-[bundle]"

      - name: Verify Windows signatures, installer contents, and build identity
        if: matrix.os == 'windows-latest'
        timeout-minutes: 10
        shell: pwsh
        env:
          ATE05_RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          if ('${{ vars.WINDOWS_CODE_SIGNING_ENABLED }}' -ne 'true') {
            throw 'Windows release signing must be enabled.'
          }
          & "$env:RUNNER_TEMP/verify-windows-build.ps1" -RequireSigning

      - name: Retain Windows crash-analysis symbols
        if: matrix.os == 'windows-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ate05-windows-x64-crash-symbols-${{ steps.source.outputs.commit }}
          if-no-files-found: error
          retention-days: 90
          path: apps/pos/src-tauri/target/release/crash-analysis/
